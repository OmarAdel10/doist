name: Shorebird CD

on:
  push:
    branches:
      - main
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: shorebird-production
  cancel-in-progress: false

jobs:
  patch:
    name: Publish Android patch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Java home for Gradle
        run: |
          # Unset any variables that might interfere with Gradle's Java home
          unset JAVA_TOOL_OPTIONS
          unset GRADLE_OPTS
          # Set the desired values from the JDK we set up
          export JAVA_HOME="$JAVA_HOME"
          export JDK_HOME="$JAVA_HOME"
          export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME"
          # Also set for subsequent steps via $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME" >> $GITHUB_ENV
          # Set Gradle Java home via properties file
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
      - name: Publish patch for latest release
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: latest

  release:
    name: Publish Android release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag matches app version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag in vX.Y.Z format, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match pubspec.yaml version $app_version" >&2
            exit 1
        run: |          # Unset any variables that might interfere with Gradle's Java home          unset JAVA_TOOL_OPTIONS          unset GRADLE_OPTS          # Set the desired values from the JDK we set up          export JAVA_HOME="$JAVA_HOME"          export JDK_HOME="$JAVA_HOME"          export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME"          # Also set for subsequent steps via $GITHUB_ENV          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV          echo "JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME" >> $GITHUB_ENV      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set Java home for Gradle
        run: |
          # Unset any variables that might interfere with Gradle's Java home
          unset JAVA_TOOL_OPTIONS
          unset GRADLE_OPTS
          # Set the desired values from the JDK we set up
          export JAVA_HOME="$JAVA_HOME"
          export JDK_HOME="$JAVA_HOME"
          export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME"
          # Also set for subsequent steps via $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME" >> $GITHUB_ENV
          # Set Gradle Java home via properties file
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Publish Android release
        id: shorebird_release
        uses: shorebirdtech/shorebird-release@v1
        with:
          flutter-version: latest
          platform: android
      - name: Get release version
        id: get_version
        run: |
          echo "release_version=${{ steps.shorebird_release.outputs.release-version }}" >> $GITHUB_OUTPUT
      - name: Collect Android release artifacts
        run: |
          mkdir -p android-artifacts
          # Standard Flutter build output for app bundle
          cp build/app/outputs/bundle/release/app-release.aab android-artifacts/app-release.aab || echo "AAB not found at expected location, searching..."
          # Standard Flutter build output for APK
          cp build/app/outputs/apk/release/app-release.apk android-artifacts/app-release.apk || echo "APK not found at expected location, searching..."
          # If not found, search for them
          if [ ! -f android-artifacts/app-release.aab ]; then
            find . -name "app-release.aab" -type f -exec cp {} android-artifacts/ \;
          fi
          if [ ! -f android-artifacts/app-release.apk ]; then
            find . -name "app-release.apk" -type f -exec cp {} android-artifacts/ \;
          fi
          ls -la android-artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Shorebird Release ${{ github.ref_name }}

            This release was built and published via Shorebird.

            ### Android
            - **AAB**: `app-release.aab` (for Play Store)
            - **APKs**: `app-release.apk` (for direct install)

            ### What's New
            See the changelog for details.
          files: |
            android-artifacts/app-release.aab
            android-artifacts/app-release.apk
          draft: false
          prerelease: false
