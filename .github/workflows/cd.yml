name: Shorebird CD

on:
  push:
    branches:
      - main
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: shorebird-production
  cancel-in-progress: false

jobs:
  patch:
    name: Publish Android patch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Publish patch for latest release
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: latest

  release:
    name: Publish Android release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches app version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag in vX.Y.Z format, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match pubspec.yaml version $app_version" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Publish Android release
        uses: shorebirdtech/shorebird-release@v1
        with:
          flutter-version: latest
          platform: android
